<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Tasks</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="main-container">

        <div class="app-box">

            <h1>Nova Tasks ✨</h1>

            <p class="subtitle">
                Organize your chaos beautifully.
            </p>

            <div class="input-section">

                <input type="text" id="taskInput" placeholder="What's your next move?">

                <div class="date-time">

                    <input type="date" id="taskDate">
                    <input type="time" id="taskTime">

                </div>

                <button onclick="addTask()">
                    + Add Task
                </button>

            </div>

            <div id="taskContainer">

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
